<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXUM </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f7, #f7e8ff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #242024;
    }

    .chat {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      max-height: 850px;
      background: white;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      padding: 24px 20px;
      text-align: center;
      background: linear-gradient(135deg, #ffb6d9, #d9b5ff);
    }
.avatar {
  width: 64px;
  height: 64px;
  margin: 0 auto 10px;
  border-radius: 50%;
  overflow: hidden;
  background: #111;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 3px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 15px;
    }

    .axum {
      align-self: flex-start;
      background: #f2edf4;
      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;
      background: #111;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .input-area {
      padding: 14px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
      background: white;
    }

    .input-area input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 25px;
      padding: 13px 16px;
      outline: none;
      font-size: 15px;
    }

    .input-area button {
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .input-area button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      <div class="avatar">
  <img src="Axum.webp" alt="Axum Civilization">
</div>
      <h1>AXUM</h1>
      
    </div>

    <div class="messages" id="messages">
      <div class="message axum">
        **ሰላም I’m AXUM  Tsion’s personal AI.**

Ask me anything.
Go on… let’s see what you can get me to answer. 👀

      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Ask AXUM anything..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">➤</button>
    </div>

  </div>
<script>
  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const text = input.value.trim();

    if (!text) return;

    // Show user's message
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;
    messages.appendChild(userMessage);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    // Show thinking message
    const thinkingMessage = document.createElement("div");
    thinkingMessage.className = "message axum";
    thinkingMessage.textContent = "Thinking... 🎀";
    messages.appendChild(thinkingMessage);

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: text
        })
      });

      const data = await response.json();

      thinkingMessage.textContent =
        data.reply || "Girl... my brain just buffered. 😭";

    } catch (error) {
      console.error(error);
      thinkingMessage.textContent =
        "Okayyy something went wrong with my brain. 😭 Try again.";
    }

    messages.scrollTop = messages.scrollHeight;
  }

  document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
</script>
</body>
</html>
